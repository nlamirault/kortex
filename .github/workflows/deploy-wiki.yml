---
name: Deploy Wiki

# Publishes wiki/ as an Astro static site to Cloudflare Workers.
# Required repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit),
# CLOUDFLARE_ACCOUNT_ID. Custom domain is attached in the Cloudflare dashboard.

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "scripts/build_knowledge_base.py"
      - "website/**"
      - ".github/workflows/deploy-wiki.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Allow one concurrent deployment; cancel superseded runs.
concurrency:
  group: deploy-wiki
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build site
        run: ./website/build.sh

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy
